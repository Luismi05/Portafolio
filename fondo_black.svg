<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
  <defs>
    <!-- Patrón de rejilla -->
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.4"></path>
    </pattern>

    <!-- Animación de desplazamiento -->
    <animateTransform id="move" attributeName="patternTransform" type="translate" from="0 0" to="10 10" dur="20s" repeatCount="indefinite"></animateTransform>
  </defs>

  <!-- Fondo oscuro -->
  <rect width="100%" height="100%" fill="#0f0f12"></rect>

  <!-- Rejilla animada -->
  <rect width="100%" height="100%" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-10 -10" dur="20s" repeatCount="indefinite"></animateTransform>
  </rect>
</svg>
