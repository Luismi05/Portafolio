<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 400" preserveAspectRatio="none">
  <defs>
    <!-- Patrón de cuadrícula -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- líneas horizontales -->
      <line x1="0" y1="0" x2="80" y2="0" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.15"></line>
      <!-- líneas verticales -->
      <line x1="0" y1="0" x2="0" y2="80" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.15"></line>
    </pattern>
  </defs>

  <!-- Fondo con animación -->
  <rect width="100%" height="100%" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="80 80" dur="40s" repeatCount="indefinite"></animateTransform>
  </rect>
</svg>
